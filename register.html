<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daftar — MusicRec</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:#fdf0f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
    .container{display:flex;width:100%;max-width:900px;background:#fff;border-radius:24px;border:1px solid #f4c0d1;overflow:hidden;min-height:600px}
    .left-panel{flex:1;background:#f9d7e7;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;gap:14px}
    .brand-icon{width:72px;height:72px;border-radius:50%;background:#D4537E;display:flex;align-items:center;justify-content:center}
    .brand-icon i{font-size:32px;color:#fff}
    .left-panel h1{font-size:26px;font-weight:700;color:#72243E;text-align:center}
    .left-panel h1 span{color:#D4537E}
    .left-panel p{font-size:13px;color:#993556;text-align:center;line-height:1.6;max-width:220px}
    .step-list{list-style:none;width:100%;max-width:240px;display:flex;flex-direction:column;gap:10px}
    .step-list li{display:flex;align-items:center;gap:10px;font-size:13px;color:#72243E;background:#fff;padding:10px 14px;border-radius:12px;border:1px solid #f4c0d1}
    .step-list li i{font-size:18px;color:#D4537E;flex-shrink:0}
    .right-panel{flex:1;padding:36px 36px;display:flex;flex-direction:column;justify-content:center}
    .right-panel h2{font-size:22px;font-weight:700;color:#72243E;margin-bottom:4px}
    .subtitle{font-size:13px;color:#b07090;margin-bottom:20px}
    .subtitle a{color:#D4537E;text-decoration:underline;font-weight:500}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .field-group{margin-bottom:14px}
    .field-label{font-size:11px;font-weight:600;color:#993556;letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px;display:block}
    .input-row{display:flex;align-items:center;gap:10px;background:#fdf0f5;border:1.5px solid #f4c0d1;border-radius:12px;padding:11px 14px;transition:border-color .2s}
    .input-row:focus-within{border-color:#D4537E;background:#fff}
    .input-row i{font-size:17px;color:#ED93B1;flex-shrink:0}
    .input-row input,.input-row select{flex:1;background:transparent;border:none;outline:none;font-size:13px;color:#4B1528;font-family:inherit}
    .input-row input::placeholder{color:#c99ab0}
    .input-row select{color:#4B1528}
    .toggle-pw{cursor:pointer;color:#c99ab0;font-size:17px}
    .toggle-pw:hover{color:#D4537E}
    .btn-primary{width:100%;background:#D4537E;color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;letter-spacing:.06em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s;font-family:inherit;margin-top:4px}
    .btn-primary:hover{background:#993556}
    .btn-primary i{font-size:18px}
    .login-text{text-align:center;font-size:13px;color:#b07090;margin-top:14px}
    .login-text a{color:#D4537E;font-weight:600;text-decoration:none}
    .login-text a:hover{text-decoration:underline}
    @media(max-width:640px){.left-panel{display:none}.right-panel{padding:28px 20px}.row2{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="container">
  <div class="left-panel">
    <div class="brand-icon"><i class="ti ti-music"></i></div>
    <h1>Music<span>Rec</span></h1>
    <p>Daftarkan dirimu dan mulai temukan musik sesuai seleramu!</p>
    <ul class="step-list">
      <li><i class="ti ti-user-plus"></i>Buat akun gratis</li>
      <li><i class="ti ti-mood-happy"></i>Isi preferensi mood & genre</li>
      <li><i class="ti ti-star"></i>Beri rating lagu favoritmu</li>
      <li><i class="ti ti-sparkles"></i>Dapatkan rekomendasi personal</li>
    </ul>
  </div>
  <div class="right-panel">
    <h2>Buat Akun</h2>
    <p class="subtitle">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
    <form onsubmit="handleRegister(event)">
      <div class="row2">
        <div class="field-group">
          <label class="field-label" for="nama">Nama Lengkap</label>
          <div class="input-row"><i class="ti ti-user"></i><input type="text" id="nama" placeholder="Nama lengkap Anda" required/></div>
        </div>
        <div class="field-group">
          <label class="field-label" for="username">Username</label>
          <div class="input-row"><i class="ti ti-at"></i><input type="text" id="username" placeholder="username_kamu" required/></div>
        </div>
      </div>
      <div class="field-group">
        <label class="field-label" for="email">Alamat Email</label>
        <div class="input-row"><i class="ti ti-mail"></i><input type="email" id="email" placeholder="nama@email.com" required/></div>
      </div>
      <div class="field-group">
        <label class="field-label" for="wa">Nomor WhatsApp</label>
        <div class="input-row"><i class="ti ti-brand-whatsapp"></i><input type="tel" id="wa" placeholder="Contoh: 08123456789" required/></div>
      </div>
      <div class="row2">
        <div class="field-group">
          <label class="field-label" for="pw">Password</label>
          <div class="input-row"><i class="ti ti-lock"></i><input type="password" id="pw" placeholder="Min. 8 karakter" required/><i class="ti ti-eye toggle-pw" onclick="togglePw('pw',this)"></i></div>
        </div>
        <div class="field-group">
          <label class="field-label" for="pw2">Konfirmasi Password</label>
          <div class="input-row"><i class="ti ti-lock-check"></i><input type="password" id="pw2" placeholder="Ulangi password" required/><i class="ti ti-eye toggle-pw" onclick="togglePw('pw2',this)"></i></div>
        </div>
      </div>
      <button type="submit" class="btn-primary"><i class="ti ti-user-plus"></i>DAFTAR SEKARANG</button>
    </form>
    <p class="login-text">Sudah punya akun? <a href="login.html">Masuk sekarang</a></p>
  </div>
</div>
<script>
  function togglePw(id,icon){
    const i=document.getElementById(id);
    if(i.type==='password'){i.type='text';icon.classList.replace('ti-eye','ti-eye-off')}
    else{i.type='password';icon.classList.replace('ti-eye-off','ti-eye')}
  }
  function handleRegister(e){
    e.preventDefault();
    const pw=document.getElementById('pw').value;
    const pw2=document.getElementById('pw2').value;
    if(pw!==pw2){alert('Password tidak cocok!');return}
    // TODO: fetch POST ke /api/register
    window.location.href='index.html';
  }
</script>
</body>
</html>
