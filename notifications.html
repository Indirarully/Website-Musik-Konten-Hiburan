<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notifikasi — MusicRec</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <link rel="stylesheet" href="sidebar2.css"/>
  <style>
    .notif-list{display:flex;flex-direction:column;gap:8px}
    .notif-item{display:flex;align-items:flex-start;gap:12px;padding:13px;background:var(--bg3);border-radius:11px;border:1px solid var(--border);transition:all .2s;cursor:pointer}
    .notif-item:hover{border-color:var(--border2);transform:translateX(3px)}
    .notif-item.unread{border-left:3px solid var(--pink);background:rgba(212,132,154,0.06)}
    .notif-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
    .notif-icon.rec{background:rgba(212,132,154,0.15);color:var(--pink)}
    .notif-icon.fav{background:rgba(196,168,130,0.15);color:var(--cream)}
    .notif-icon.sys{background:rgba(155,163,181,0.15);color:var(--sub)}
    .notif-icon.rating{background:rgba(180,120,200,0.15);color:#d4a8e8}
    .notif-info{flex:1;min-width:0}
    .notif-title{font-size:13px;font-weight:600;color:var(--white);margin-bottom:2px}
    .notif-body{font-size:12px;color:var(--sub);line-height:1.5}
    .notif-time{font-size:11px;color:var(--sub);white-space:nowrap;flex-shrink:0}
    .unread-dot{width:8px;height:8px;border-radius:50%;background:var(--pink);flex-shrink:0;margin-top:5px}
    .title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .btn-clear{background:transparent;border:1px solid var(--border);color:var(--sub);border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;align-items:center;gap:5px}
    .btn-clear:hover{border-color:var(--pink);color:var(--pink);transform:scale(1.04)}
  </style>
</head>
<body>
<div class="main">
  <div class="content">
    <div class="card">
      <div class="title-row">
        <div class="section-title">Notifikasi 🔔</div>
        <button class="btn-clear" onclick="clearAll()"><i class="ti ti-check"></i> Tandai Semua Dibaca</button>
      </div>
      <div id="notifContent"></div>
    </div>
  </div>
</div>
<script src="sidebar3.js"></script>
<script>
  buildSidebar('notifications.html');
  buildTopbar('Notifikasi');

  const defaultNotifs = [
    {icon:'rec',title:'Rekomendasi Baru Untukmu! ✨',body:'Kami punya 5 lagu baru yang cocok dengan selera musikmu hari ini.',time:'Baru saja',unread:true},
    {icon:'fav',title:'Lagu Favorit Trending 🔥',body:'"Be There for Me" — NCT 127 sedang trending di chart Pop minggu ini.',time:'1 jam lalu',unread:true},
    {icon:'rating',title:'Lengkapi Rating Lagumu ⭐',body:'Kamu baru mendengarkan 3 lagu tapi belum memberi rating. Yuk lengkapi!',time:'3 jam lalu',unread:false},
    {icon:'sys',title:'Profil Berhasil Diperbarui',body:'Data profil dan preferensi musikmu telah berhasil disimpan.',time:'Kemarin',unread:false},
    {icon:'rec',title:'Genre Baru Tersedia 🎵',body:'Konten K-Pop terbaru sudah ditambahkan ke sistem rekomendasi.',time:'2 hari lalu',unread:false},
    {icon:'sys',title:'Selamat Datang di MusicRec! 🎉',body:'Akun kamu sudah aktif. Mulai cari dan rating lagu favoritmu sekarang!',time:'Juni 2026',unread:false},
  ];

  function render(){
    const el=document.getElementById('notifContent');
    const notifs=getNotifs().length?getNotifs():defaultNotifs;
    if(!notifs.length){el.innerHTML='<div class="empty-state"><i class="ti ti-bell-off"></i><p>Tidak ada notifikasi</p></div>';return;}
    el.innerHTML=`<div class="notif-list">${notifs.map((n,i)=>`
      <div class="notif-item ${n.unread?'unread':''}" onclick="markRead(${i})">
        <div class="notif-icon ${n.icon}"><i class="ti ti-${n.icon==='rec'?'sparkles':n.icon==='fav'?'heart':n.icon==='rating'?'star':'info-circle'}"></i></div>
        <div class="notif-info">
          <div class="notif-title">${n.title}</div>
          <div class="notif-body">${n.body}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
          <span class="notif-time">${n.time}</span>
          ${n.unread?'<div class="unread-dot"></div>':''}
        </div>
      </div>`).join('')}
    </div>`;
  }

  function markRead(i){
    let n=getNotifs().length?getNotifs():[...defaultNotifs];
    if(n[i])n[i].unread=false;
    localStorage.setItem('mr_notifs',JSON.stringify(n));
    render();
  }

  function clearAll(){
    const notifs=(getNotifs().length?getNotifs():[...defaultNotifs]).map(n=>({...n,unread:false}));
    localStorage.setItem('mr_notifs',JSON.stringify(notifs));
    render();
  }

  render();
</script>
</body>
</html>
