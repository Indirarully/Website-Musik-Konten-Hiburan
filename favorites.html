<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Favorit — MusicRec</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <link rel="stylesheet" href="sidebar2.css"/>
  <style>
    .fav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
    .fav-card{background:var(--bg3);border-radius:12px;padding:14px;border:1px solid var(--border);position:relative;transition:all .2s cubic-bezier(.34,1.56,.64,1)}
    .fav-card:hover{border-color:var(--border2);transform:translateY(-3px);box-shadow:0 8px 20px rgba(212,132,154,0.12)}
    .fav-thumb{width:48px;height:48px;border-radius:10px;background:rgba(212,132,154,0.15);display:flex;align-items:center;justify-content:center;margin-bottom:10px;overflow:hidden;transition:transform .2s}
    .fav-card:hover .fav-thumb{transform:scale(1.08) rotate(-3deg)}
    .fav-thumb img{width:48px;height:48px;object-fit:cover;border-radius:10px}
    .fav-thumb i{font-size:22px;color:var(--pink)}
    .fav-title{font-size:12px;font-weight:600;color:var(--white);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .fav-artist{font-size:11px;color:var(--sub)}
    .fav-remove{position:absolute;top:8px;right:8px;background:rgba(212,132,154,0.12);border:none;cursor:pointer;color:var(--sub);font-size:13px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .2s}
    .fav-remove:hover{background:rgba(212,132,154,0.25);color:var(--pink);transform:scale(1.15) rotate(90deg)}
    .btn-clear{background:transparent;border:1px solid var(--border);color:var(--sub);border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;align-items:center;gap:5px}
    .btn-clear:hover{border-color:var(--pink);color:var(--pink);transform:scale(1.04)}
    .title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  </style>
</head>
<body>
<div class="main">
  <div class="content">
    <div class="card">
      <div class="title-row">
        <div class="section-title">Favorit Saya 🩷</div>
        <button class="btn-clear" onclick="clearAll()"><i class="ti ti-trash"></i> Hapus Semua</button>
      </div>
      <div id="favContent"></div>
    </div>
  </div>
</div>
<script src="sidebar2.js"></script>
<script>
  buildSidebar('favorites.html');
  buildTopbar('Favorit Saya');

  function render() {
    const f = getFavorites();
    const el = document.getElementById('favContent');
    if (!f.length) {
      el.innerHTML = '<div class="empty-state"><i class="ti ti-heart"></i><p>Belum ada lagu favorit.<br>Tap ❤️ saat memutar lagu untuk menyimpannya!</p></div>';
      return;
    }
    el.innerHTML = `<div class="fav-grid">${f.map(item=>`
      <div class="fav-card">
        <button class="fav-remove" onclick="remove('${item.title.replace(/'/g,"\\'")}')"><i class="ti ti-x"></i></button>
        <div class="fav-thumb">
          ${item.cover?`<img src="${item.cover}" onerror="this.parentElement.innerHTML='<i class=\\'ti ti-music\\'></i>'"/>`:'<i class="ti ti-music"></i>'}
        </div>
        <div class="fav-title">${item.title}</div>
        <div class="fav-artist">${item.artist}</div>
      </div>`).join('')}
    </div>`;
  }

  function remove(title) { removeFavorite(title); render(); }
  function clearAll() { if(confirm('Hapus semua favorit?')){localStorage.removeItem('mr_favs');render();} }

  render();
</script>
</body>
</html>
