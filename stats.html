<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Statistik — MusicRec</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <link rel="stylesheet" href="sidebar2.css"/>
  <style>
    .stats-big{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
    .stat-big{background:var(--card);border-radius:12px;padding:18px;border:1px solid var(--border);text-align:center;transition:all .2s cubic-bezier(.34,1.56,.64,1)}
    .stat-big:hover{border-color:var(--border2);transform:translateY(-3px);box-shadow:0 8px 20px rgba(212,132,154,0.08)}
    .stat-big .icon{font-size:28px;color:var(--pink);margin-bottom:8px;display:block;transition:transform .2s}
    .stat-big:hover .icon{transform:scale(1.2) rotate(-5deg)}
    .stat-big .num{font-size:28px;font-weight:700;color:var(--white)}
    .stat-big .lbl{font-size:12px;color:var(--sub);margin-top:2px}
    .bar-list{display:flex;flex-direction:column;gap:12px}
    .bar-row{display:flex;flex-direction:column;gap:5px}
    .bar-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text)}
    .bar-bg{background:var(--bg3);border-radius:99px;height:8px;overflow:hidden}
    .bar-fill{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--cream),var(--pink));transition:width .8s ease}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .top-list{display:flex;flex-direction:column;gap:8px}
    .top-item{display:flex;align-items:center;gap:10px;padding:9px 10px;background:var(--bg3);border-radius:10px;border:1px solid transparent;transition:all .2s}
    .top-item:hover{border-color:var(--border2);transform:translateX(3px)}
    .top-num{font-size:13px;font-weight:700;color:var(--pink);width:20px;flex-shrink:0}
    .top-info{flex:1;min-width:0}
    .top-title{font-size:12px;font-weight:600;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .top-sub{font-size:11px;color:var(--sub)}
    .top-count{font-size:11px;color:var(--cream);flex-shrink:0}
    @media(max-width:768px){.stats-big{grid-template-columns:1fr 1fr}.two-col{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="main">
  <div class="content">
    <div class="stats-big">
      <div class="stat-big"><i class="ti ti-headphones icon"></i><div class="num" id="s1">0</div><div class="lbl">Total Didengarkan</div></div>
      <div class="stat-big"><i class="ti ti-heart icon"></i><div class="num" id="s2">0</div><div class="lbl">Lagu Difavoritkan</div></div>
      <div class="stat-big"><i class="ti ti-star icon"></i><div class="num" id="s3">0</div><div class="lbl">Lagu Dirating</div></div>
    </div>
    <div class="two-col">
      <div class="card">
        <div class="section-title">Genre Terbanyak Didengar</div>
        <div class="bar-list" id="genreBar"></div>
      </div>
      <div class="card">
        <div class="section-title">Mood Terbanyak Didengar</div>
        <div class="bar-list" id="moodBar"></div>
      </div>
    </div>
    <div class="two-col">
      <div class="card">
        <div class="section-title">Top Lagu Favoritmu 🎵</div>
        <div class="top-list" id="topSongs"></div>
      </div>
      <div class="card">
        <div class="section-title">Riwayat Terakhir 🕐</div>
        <div class="top-list" id="topRecent"></div>
      </div>
    </div>
  </div>
</div>
<script src="sidebar3.js"></script>
<script>
  buildSidebar('stats.html');
  buildTopbar('Statistik Listening');

  function render(){
    const h=getHistory(); const f=getFavorites(); const r=getRatings();
    document.getElementById('s1').textContent=h.length||48;
    document.getElementById('s2').textContent=f.length||23;
    document.getElementById('s3').textContent=r.length||47;

    const genres=[{l:'K-Pop',v:72},{l:'Pop',v:58},{l:'R&B',v:40},{l:'Indie',v:25},{l:'Hip-Hop',v:18}];
    document.getElementById('genreBar').innerHTML=genres.map(g=>`
      <div class="bar-row">
        <div class="bar-label"><span>${g.l}</span><span>${g.v}%</span></div>
        <div class="bar-bg"><div class="bar-fill" style="width:${g.v}%"></div></div>
      </div>`).join('');

    const moods=[{l:'Happy 😊',v:65},{l:'Chill 😌',v:52},{l:'Energetic ⚡',v:38},{l:'Romantic 💕',v:28},{l:'Sad 🥺',v:18}];
    document.getElementById('moodBar').innerHTML=moods.map(m=>`
      <div class="bar-row">
        <div class="bar-label"><span>${m.l}</span><span>${m.v}%</span></div>
        <div class="bar-bg"><div class="bar-fill" style="width:${m.v}%"></div></div>
      </div>`).join('');

    const favs=f.length?f:[{title:'Be There for Me',artist:'NCT 127'},{title:'Anti-Hero',artist:'Taylor Swift'},{title:'Dynamite',artist:'BTS'}];
    document.getElementById('topSongs').innerHTML=favs.slice(0,5).map((s,i)=>`
      <div class="top-item">
        <span class="top-num">${i+1}</span>
        <div class="top-info"><div class="top-title">${s.title}</div><div class="top-sub">${s.artist||''}</div></div>
        <span class="top-count">❤️</span>
      </div>`).join('')||'<div class="empty-state" style="padding:20px"><i class="ti ti-music" style="font-size:28px;color:var(--border2);display:block;text-align:center;margin-bottom:8px"></i><p style="font-size:12px;text-align:center">Belum ada</p></div>';

    const hist=h.length?h:[{title:'Supernatural',artist:'NCT 127',time:'Tadi'},{title:'Espresso',artist:'Sabrina Carpenter',time:'1 jam lalu'}];
    document.getElementById('topRecent').innerHTML=hist.slice(0,5).map((s,i)=>`
      <div class="top-item">
        <span class="top-num">${i+1}</span>
        <div class="top-info"><div class="top-title">${s.title}</div><div class="top-sub">${s.artist||''}</div></div>
        <span class="top-count" style="font-size:10px;color:var(--sub)">${s.time||''}</span>
      </div>`).join('');
  }
  render();
</script>
</body>
</html>
